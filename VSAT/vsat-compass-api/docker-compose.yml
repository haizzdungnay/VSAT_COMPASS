services:
  redis:
    image: redis:7-alpine
    container_name: vsat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 220mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    container_name: vsat-api
    build: .
    restart: unless-stopped
    ports:
      - "18080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://host.docker.internal:5432/vsat_compass
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      JWT_SECRET: dnNhdGNvbXBhc3Mtc3VwZXItc2VjcmV0LWp3dC1rZXktMjU2Yml0LXByb2R1Y3Rpb24tMjAyNC12c2F0
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      HIBERNATE_SQL_LOG: WARN
      REDIS_HOST: redis
      REDIS_PORT: 6379

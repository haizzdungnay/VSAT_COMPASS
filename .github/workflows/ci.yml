name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend Tests (Spring Boot Java 17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Backend Tests
        working-directory: VSAT/vsat-compass-api
        run: |
          chmod +x gradlew
          ./gradlew test --console=plain

  web-admin:
    name: Web Admin (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: web-admin/package-lock.json

      - name: Install dependencies
        working-directory: web-admin
        run: npm ci

      - name: Oxlint code check
        working-directory: web-admin
        run: npm run lint

      - name: TypeScript & Vite Build
        working-directory: web-admin
        run: npm run build

  android:
    name: Android Client (Test & Assemble APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android Unit Tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --console=plain

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsat-compass-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
